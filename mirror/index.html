<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>OMNI Mirror · Soul-time</title>
<meta name="description" content="OMNI Mirror — Soul-time geometry canvas. Tool not throne. Member maps start fresh."/>
<style>
  :root { color-scheme: dark; --bg:#0b1220; --fg:#e8eef8; --muted:#9aa8bf; --card:#121a2b; --line:#243049; --accent:#c9a227; --link:#7dd3a7; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2740 0%, var(--bg) 55%);
    color: var(--fg); padding: 1.25rem;
  }
  .card {
    width: min(28rem, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 1.5rem 1.35rem 1.35rem;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  .icon {
    width: 2.75rem; height: 2.75rem; border-radius: 999px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #243552, #152033);
    border: 1px solid var(--line);
    font-size: 1.35rem; margin-bottom: .9rem;
  }
  h1 { font-size: 1.15rem; font-weight: 650; margin: 0 0 .35rem; letter-spacing: .01em; }
  .tag { color: var(--muted); font-size: .88rem; margin: 0 0 1.1rem; line-height: 1.45; }
  a.enter {
    display: inline-flex; align-items: center; gap: .55rem;
    text-decoration: none; color: #0b1220; background: var(--link);
    font-weight: 650; font-size: .95rem;
    padding: .7rem 1rem; border-radius: 999px;
  }
  a.enter:hover { filter: brightness(1.06); }
  .foot { margin-top: 1rem; font-size: .78rem; color: var(--muted); line-height: 1.4; }
  .foot a { color: var(--accent); }
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon" aria-hidden="true">◈</div>
    <h1>OMNI Mirror · Soul-time · geometry first</h1>
    <p class="tag">Live canvas door. Tool not throne — seats not swarm. Vision first. Open Soul-time to walk the geometry.</p>
    <a class="enter" href="./soul-time/">Enter Soul-time <span aria-hidden="true">→</span></a>
    <p class="foot">Also: <a href="../">mindmap doors</a> · One Mission kingdom tree<br/>
    Member maps start fresh — no steward clone; consilience listens over time.</p>
  </main>
</body>
</html>
