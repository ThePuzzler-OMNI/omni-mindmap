<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>OMNI Mirror Soul-time</title>
</head><body>
<p id="st" style="font:14px system-ui;color:#9aa8bf;background:#0b1220;margin:0;padding:1rem">Loading Soul-time…</p>
<script type="module">
const n = 12;
const baseLocal = new URL('./', import.meta.url);
const baseRemote = 'https://raw.githubusercontent.com/ThePuzzler-OMNI/omni-mindmap/main/mirror/soul-time/';
const parts = [];
try {
  for (let i = 0; i < n; i++) {
    let text = null;
    try {
      const r = await fetch(new URL('part' + i + '.txt', baseLocal));
      if (r.ok) text = await r.text();
    } catch (_) {}
    if (text == null) {
      const r = await fetch(baseRemote + 'part' + i + '.txt');
      if (!r.ok) throw new Error('part ' + i + ' ' + r.status);
      text = await r.text();
    }
    parts.push(text);
  }
  const html = atob(parts.join(''));
  document.open(); document.write(html); document.close();
} catch (e) {
  const el = document.getElementById('st');
  if (el) el.textContent = 'Soul-time load failed: ' + (e && e.message);
}
</script>
</body></html>
